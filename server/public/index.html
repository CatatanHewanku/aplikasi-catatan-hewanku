    <script>
      window.__appReady = false;
      window.__hideAppSplash = function () {
        const splash = document.getElementById('app-splash');
        if (splash) {
          splash.classList.add('hidden');
          setTimeout(() => splash.remove(), 220);
        }
      };

      window.addEventListener('DOMContentLoaded', function () {
        window.__appSplashTimer = setTimeout(function () {
          if (window.__appReady) return;

          const title = document.querySelector('.splash-title');
          const spinner = document.querySelector('.splash-spinner');
          if (title) title.textContent = 'Still loading... Check your connection.';
          if (spinner) spinner.remove();
        }, 90000);
      });
    </script>

        <div class="splash-title">Preparing CatatanHewanku...</div>
